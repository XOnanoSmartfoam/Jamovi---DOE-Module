---
name: screening
title: Screening Design
jrs: '1.1'

items:
    - name: info
      title: Design Summary
      type: Html
      clearWith:
        - factors
        - designType
        - nRuns
        - centerPoints
        - randomize
        - seed
        - replicates
        - responses
        - responseTarget
        - simulateResponses

    - name: design
      title: Design Table
      type: Table
      clearWith:
        - factors
        - designType
        - nRuns
        - centerPoints
        - randomize
        - seed
        - replicates
        - responses
        - responseTarget
        - simulateResponses
      columns:
        - name: Run
          title: Run
          type: text

    - name: alias
      title: Alias Structure
      type: Preformatted
      clearWith:
        - factors
        - designType
        - nRuns
        - centerPoints
        - randomize
        - seed

    - name: analysisInfo
      title: Model Summary
      type: Html
      visible: (evaluateDesign)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisAnova
      title: ANOVA
      type: Table
      visible: (evaluateDesign)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses
      columns:
        - name: response
          title: Response
          type: text
        - name: term
          title: Term
          type: text
        - name: ss
          title: Sum of Squares
          type: number
        - name: df
          title: df
          type: integer
        - name: ms
          title: Mean Square
          type: number
        - name: F
          title: F
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: analysisCoef
      title: Coefficients
      type: Table
      visible: (evaluateDesign)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses
      columns:
        - name: response
          title: Response
          type: text
        - name: term
          title: Term
          type: text
        - name: estimate
          title: Estimate
          type: number
        - name: se
          title: SE
          type: number
        - name: t
          title: t
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue


    - name: analysisRecommend
      title: Preferred settings
      type: Table
      visible: (evaluateDesign)
      clearWith:
        - evaluateDesign
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses
      columns:
        - name: response
          title: Response
          type: text
        - name: goal
          title: Goal
          type: text
        - name: factor
          title: Factor
          type: text
        - name: level
          title: Preferred level
          type: text
        - name: mean
          title: Mean
          type: number
    - name: analysisHalfNormal
      title: Half-Normal Plot
      type: Image
      width: 450
      height: 400
      renderFun: .plotHalfNormal
      visible: (evaluateDesign && halfNormal)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisPareto
      title: Pareto Plot
      type: Image
      width: 450
      height: 400
      renderFun: .plotPareto
      visible: (evaluateDesign && pareto)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisMainEffects
      title: Main Effects Plot
      type: Image
      width: 500
      height: 400
      renderFun: .plotMainEffects
      visible: (evaluateDesign && mainEffects)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisInteraction
      title: Interaction Plot
      type: Image
      width: 450
      height: 400
      renderFun: .plotInteraction
      visible: (evaluateDesign && interaction)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisResiduals
      title: Residual Plots
      type: Image
      width: 500
      height: 400
      renderFun: .plotResiduals
      visible: (evaluateDesign && residuals)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: analysisContour
      title: Contour Plot
      type: Image
      width: 450
      height: 400
      renderFun: .plotContour
      visible: (evaluateDesign && contour)
      clearWith:
        - evaluateDesign
        - analysisModel
        - factors
        - replicates
        - seed
        - responses
        - responseTarget
        - simulateResponses

    - name: designOutput
      title: Spreadsheet columns
      type: Output
      initInRun: true
