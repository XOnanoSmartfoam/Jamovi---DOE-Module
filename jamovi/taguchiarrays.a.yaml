---
name: taguchiarrays
title: Taguchi Arrays
menuGroup: DOE
version: '1.0.0'
jas: '1.2'
completeWhenFilled: false

description:
    main: >-
        Generate a Taguchi orthogonal array for control factors, with an
        optional outer / noise array. The inner array is written at least
        twice so S/N ANOVA has residual degrees of freedom without pooling a
        factor. After the experiment, fit the measured results with Analyze
        Design.

options:
    - name: data
      type: Data

    - name: arrayId
      title: Orthogonal array
      type: List
      options:
        - title: L4 (3 factors @ 2 levels)
          name: L4.2.3
        - title: L8 (7 factors @ 2 levels)
          name: L8.2.7
        - title: L9 (4 factors @ 3 levels)
          name: L9.3.4
        - title: L12 (11 factors @ 2 levels)
          name: L12.2.11
        - title: L16 (15 factors @ 2 levels)
          name: L16.2.15
        - title: L16 (5 factors @ 4 levels)
          name: L16.4.5
        - title: L18 (1@2 + 7@3 levels)
          name: L18.2.1.3.7
        - title: L27 (13 factors @ 3 levels)
          name: L27.3.13
        - title: L32 (31 factors @ 2 levels)
          name: L32.2.31
      default: L8.2.7

    - name: factors
      title: Control factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: levels
              type: String
              default: '1, 2'

    - name: useOuter
      title: Include outer / noise array
      type: Bool
      default: false

    - name: noiseFactors
      title: Noise factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: levels
              type: String
              default: 'Low, High'

    - name: replicates
      title: Replicates
      type: Integer
      min: 2
      default: 2
      description:
          R: >-
              copies of the inner array; at least two so S/N ANOVA has residual
              degrees of freedom without pooling a factor

    - name: randomize
      title: Randomize run order
      type: Bool
      default: true

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: responses
      title: Responses
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: goal
              type: List
              options:
                - title: Maximize
                  name: maximize
                - title: Minimize
                  name: minimize
                - title: Match target
                  name: match
              default: maximize
            - name: target
              title: Target
              type: Number
              default: 0

    - name: responseTarget
      title: Target value
      type: Number
      default: 0
      hidden: true


    - name: simulateResponses
      title: Fill responses with random data
      type: Bool
      default: true

    - name: designOutput
      title: Add design to spreadsheet
      type: Output
...
