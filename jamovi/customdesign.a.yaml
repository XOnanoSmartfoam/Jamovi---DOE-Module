---
name: customdesign
title: Custom Design
menuGroup: DOE
version: '1.0.0'
jas: '1.2'
completeWhenFilled: false

description:
    main: >-
        Generate a custom optimal design when a standard factorial, screening,
        or response-surface array does not fit the run budget or factor mix.
        Choose a model (mains, two-factor interactions, or quadratic) and
        D- or I-optimality, then write the runs to the spreadsheet.

options:
    - name: data
      type: Data

    - name: factors
      title: Factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: type
              type: List
              options:
                - title: Continuous
                  name: continuous
                - title: Categorical
                  name: categorical
              default: continuous
            - name: levels
              type: String
              default: '-1, 1'

    - name: model
      title: Model
      type: List
      options:
        - title: Main effects
          name: main
        - title: Main effects + 2-factor interactions
          name: main2fi
        - title: Response surface (quadratic)
          name: rsm
      default: main

    - name: criterion
      title: Optimality
      type: List
      options:
        - title: D-optimal
          name: D
        - title: I-optimal
          name: I
      default: D

    - name: nRuns
      title: Number of runs
      type: Integer
      min: 4
      default: 12

    - name: replicates
      title: Replicates
      type: Integer
      min: 1
      default: 1

    - name: randomize
      title: Randomize run order
      type: Bool
      default: true

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: responses
      title: Responses
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: goal
              type: List
              options:
                - title: Maximize
                  name: maximize
                - title: Minimize
                  name: minimize
                - title: Match target
                  name: match
              default: maximize
            - name: target
              title: Target
              type: Number
              default: 0

    - name: responseTarget
      title: Target value
      type: Number
      default: 0
      hidden: true


    - name: simulateResponses
      title: Fill responses with random data
      type: Bool
      default: true

    - name: designOutput
      title: Add design to spreadsheet
      type: Output
...
