title: Response Surface Design
name: rsmdesign
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Continuous factors (low, high)
    collapsed: false
    stretchFactor: 1
    children:
      - type: ListBox
        name: factors
        height: large
        showColumnHeaders: true
        addButton: Add factor
        stretchFactor: 1
        columns:
          - name: name
            label: Name
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: levels
            label: Low, High
            stretchFactor: 2
            template:
              type: TextBox
              format: string
  - type: CollapseBox
    label: Responses
    collapsed: false
    stretchFactor: 1
    children:
      - type: ListBox
        name: responses
        height: large
        showColumnHeaders: true
        addButton: Add response
        stretchFactor: 1
        columns:
          - name: name
            label: Name
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: goal
            label: Goal
            stretchFactor: 1
            template:
              type: ComboBox
          - name: target
            label: Target
            stretchFactor: 1
            template:
              type: TextBox
              format: number
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: simulateResponses
  - type: CollapseBox
    label: Runs
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: designType
          - type: ComboBox
            name: alpha
            enable: (designType:ccd)
          - type: TextBox
            name: n0
            format: number
          - type: TextBox
            name: replicates
            format: number
          - type: CheckBox
            name: randomize
          - type: TextBox
            name: seed
            format: number
            enable: (randomize)
          - type: Label
            stretchFactor: 1
            label: 'Each extra copy stacks the whole design (Run 1.1, 1.2, …).'
          - type: Label
            stretchFactor: 1
            label: 'The Design Table updates as you change settings. Check Add design to'
          - type: Label
            stretchFactor: 1
            label: 'spreadsheet when you want the runs in Data.'
  - type: CollapseBox
    label: Spreadsheet
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: designOutput
          - type: Label
            stretchFactor: 1
            label: 'Writes Run, factor, and response columns into the Data spreadsheet'
          - type: Label
            stretchFactor: 1
            label: 'and keeps them in step with the design.'
          - type: Label
            stretchFactor: 1
            label: 'Use a new or empty file so existing columns are not mixed with'
          - type: Label
            stretchFactor: 1
            label: 'the design.'
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        stretchFactor: 1
        label: 'When the runs are done and the measured values are in the'
      - type: Label
        stretchFactor: 1
        label: 'spreadsheet, fit the model with DOE > Analyze Design.'
