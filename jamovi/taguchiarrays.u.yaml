title: Taguchi Arrays
name: taguchiarrays
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Orthogonal array
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: arrayId
  - type: CollapseBox
    label: Control factors
    collapsed: false
    stretchFactor: 1
    children:
      - type: ListBox
        name: factors
        height: large
        showColumnHeaders: true
        addButton: Add factor
        stretchFactor: 1
        columns:
          - name: name
            label: Name
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: levels
            label: Levels (comma-separated)
            stretchFactor: 2
            template:
              type: TextBox
              format: string
  - type: CollapseBox
    label: Responses
    collapsed: false
    stretchFactor: 1
    children:
      - type: ListBox
        name: responses
        height: large
        showColumnHeaders: true
        addButton: Add response
        stretchFactor: 1
        columns:
          - name: name
            label: Name
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: goal
            label: Goal
            stretchFactor: 1
            template:
              type: ComboBox
          - name: target
            label: Target
            stretchFactor: 1
            template:
              type: TextBox
              format: number
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: simulateResponses
  - type: CollapseBox
    label: Noise factors (outer array)
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: useOuter
      - type: ListBox
        name: noiseFactors
        height: large
        showColumnHeaders: true
        addButton: Add noise factor
        stretchFactor: 1
        columns:
          - name: name
            label: Name
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: levels
            label: Levels (comma-separated)
            stretchFactor: 2
            template:
              type: TextBox
              format: string
      - type: CollapseBox
        label: About the outer array
        collapsed: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: small
            stretchFactor: 1
            children:
              - type: Label
                stretchFactor: 1
                label: 'Noise factors are conditions you cannot control in production'
              - type: Label
                stretchFactor: 1
                label: '(humidity, lot, operator).'
              - type: Label
                stretchFactor: 1
                label: 'Vary them in the lab to find control settings that stay on target'
              - type: Label
                stretchFactor: 1
                label: 'when those change.'
              - type: Label
                stretchFactor: 1
                label: 'Check Include outer / noise array, then add each noise factor'
              - type: Label
                stretchFactor: 1
                label: 'by name and levels (usually Low, High).'
              - type: Label
                stretchFactor: 1
                label: 'The inner array is control recipes (rows).'
              - type: Label
                stretchFactor: 1
                label: 'The outer array does not add more rows.'
              - type: Label
                stretchFactor: 1
                label: 'It adds Y columns so each inner run is measured at every noise'
              - type: Label
                stretchFactor: 1
                label: 'combination.'
              - type: Label
                stretchFactor: 1
                label: 'SN analysis uses those Y columns. Maximize / Minimize / Match target'
              - type: Label
                stretchFactor: 1
                label: 'pick the SN type.'
              - type: Label
                stretchFactor: 1
                label: 'Skip this section to screen controls only.'
              - type: Label
                stretchFactor: 1
                label: 'Replicates repeat the whole design under the same conditions;'
              - type: Label
                stretchFactor: 1
                label: 'that is not the same as noise factors.'
  - type: CollapseBox
    label: Runs
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: replicates
            format: number
          - type: CheckBox
            name: randomize
          - type: TextBox
            name: seed
            format: number
            enable: (randomize)
          - type: Label
            stretchFactor: 1
            label: 'Two copies of the array are required so S/N ANOVA has residual df'
          - type: Label
            stretchFactor: 1
            label: 'without pooling.'
          - type: Label
            stretchFactor: 1
            label: 'Further copies stack the whole design (Run 1.1, 1.2, …).'
          - type: Label
            stretchFactor: 1
            label: 'The Design Table updates as you change settings. Check Add design to'
          - type: Label
            stretchFactor: 1
            label: 'spreadsheet when you want the runs in Data.'
  - type: CollapseBox
    label: Spreadsheet
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: designOutput
          - type: Label
            stretchFactor: 1
            label: 'Writes Run, factor, and response columns into the Data spreadsheet'
          - type: Label
            stretchFactor: 1
            label: 'and keeps them in step with the design.'
          - type: Label
            stretchFactor: 1
            label: 'Use a new or empty file so existing columns are not mixed with'
          - type: Label
            stretchFactor: 1
            label: 'the design.'
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        stretchFactor: 1
        label: 'When the runs are done and the measured values are in the'
      - type: Label
        stretchFactor: 1
        label: 'spreadsheet, fit the model with DOE > Analyze Design.'
