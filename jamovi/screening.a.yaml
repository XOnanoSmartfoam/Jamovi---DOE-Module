---
name: screening
title: Screening Design
menuGroup: DOE
version: '1.0.0'
jas: '1.2'
completeWhenFilled: false

options:
    - name: data
      type: Data

    - name: factors
      title: Factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: levels
              type: String
              default: '-1, 1'

    - name: designType
      title: Design type
      type: List
      options:
        - title: Regular fractional factorial (FrF2)
          name: frf2
        - title: Plackett-Burman
          name: pb
      default: frf2

    - name: nRuns
      title: Number of runs
      type: Integer
      min: 4
      default: 8

    - name: centerPoints
      title: Center points
      type: Integer
      min: 0
      default: 0

    - name: replicates
      title: Replicates
      type: Integer
      min: 1
      default: 1

    - name: randomize
      title: Randomize run order
      type: Bool
      default: true

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: responses
      title: Responses
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: goal
              type: List
              options:
                - title: Maximize
                  name: maximize
                - title: Minimize
                  name: minimize
                - title: Match target
                  name: match
              default: maximize
            - name: target
              title: Target
              type: Number
              default: 0

    - name: responseTarget
      title: Target value
      type: Number
      default: 0
      hidden: true


    - name: simulateResponses
      title: Fill responses with random data
      type: Bool
      default: true

    - name: evaluateDesign
      title: Evaluate this design
      type: Bool
      default: false

    - name: analysisModel
      title: Analysis model
      type: List
      options:
        - title: Main effects
          name: main
        - title: Main + 2-factor interactions
          name: main2fi
        - title: Response surface (quadratic)
          name: rsm
      default: main

    - name: halfNormal
      title: Half-normal plot
      type: Bool
      default: true

    - name: pareto
      title: Pareto plot of |effects|
      type: Bool
      default: true

    - name: mainEffects
      title: Main effects plot
      type: Bool
      default: false

    - name: interaction
      title: Interaction plot
      type: Bool
      default: false

    - name: residuals
      title: Residual plots
      type: Bool
      default: true

    - name: contour
      title: Contour plot (first two continuous factors)
      type: Bool
      default: false
...
