---
name: screening
title: Screening Design
menuGroup: DOE
version: '1.0.0'
jas: '1.2'
completeWhenFilled: false

description:
    main: >-
        Generate a two-level screening design to find which factors matter
        with relatively few runs. Choose a regular fractional factorial (FrF2)
        or a Plackett-Burman array, set the number of runs and optional centre
        points, then write the design to the spreadsheet. Fit the measured
        results with Analyze Design.

options:
    - name: data
      type: Data

    - name: factors
      title: Factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: levels
              type: String
              default: '-1, 1'

    - name: designType
      title: Design type
      type: List
      options:
        - title: Regular fractional factorial (FrF2)
          name: frf2
        - title: Plackett-Burman
          name: pb
      default: frf2

    - name: nRuns
      title: Number of runs
      type: Integer
      min: 4
      default: 8

    - name: centerPoints
      title: Center points
      type: Integer
      min: 0
      default: 0

    - name: replicates
      title: Replicates
      type: Integer
      min: 1
      default: 1

    - name: randomize
      title: Randomize run order
      type: Bool
      default: true

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: responses
      title: Responses
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: goal
              type: List
              options:
                - title: Maximize
                  name: maximize
                - title: Minimize
                  name: minimize
                - title: Match target
                  name: match
              default: maximize
            - name: target
              title: Target
              type: Number
              default: 0

    - name: responseTarget
      title: Target value
      type: Number
      default: 0
      hidden: true


    - name: simulateResponses
      title: Fill responses with random data
      type: Bool
      default: true

    - name: designOutput
      title: Add design to spreadsheet
      type: Output
...
