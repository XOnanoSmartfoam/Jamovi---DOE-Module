---
name: fullfactorial
title: Full Factorial Design
menuGroup: DOE
version: '1.0.0'
jas: '1.2'
completeWhenFilled: false

description:
    main: >-
        Generate a full factorial design for factors with two or more levels,
        including mixed-level designs. Optionally randomize the run order,
        replicate the whole design, add response columns, and write the runs
        to the spreadsheet. After you measure the responses, fit a model with
        Analyze Design.

options:
    - name: data
      type: Data

    - name: factors
      title: Factors
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: levels
              type: String
              default: '-1, 1'

    - name: replicates
      title: Replicates
      type: Integer
      min: 1
      default: 1

    - name: randomize
      title: Randomize run order
      type: Bool
      default: true

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: responses
      title: Responses
      type: Array
      default: []
      template:
          type: Group
          elements:
            - name: name
              type: String
              default: ''
            - name: goal
              type: List
              options:
                - title: Maximize
                  name: maximize
                - title: Minimize
                  name: minimize
                - title: Match target
                  name: match
              default: maximize
            - name: target
              title: Target
              type: Number
              default: 0

    - name: responseTarget
      title: Target value
      type: Number
      default: 0
      hidden: true


    - name: simulateResponses
      title: Fill responses with random data
      type: Bool
      default: true

    - name: designOutput
      title: Add design to spreadsheet
      type: Output
...
